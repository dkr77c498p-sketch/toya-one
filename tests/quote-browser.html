<script>/* Offline fixture only: about:blank has no secure-context randomUUID. */
let fixtureId=0;if(!crypto.randomUUID)crypto.randomUUID=()=> '00000000-0000-4000-8000-'+String(++fixtureId).padStart(12,'0');
window.__quoteCalls=[];window.__savedPlans=[];const cloudProfile={active:true,role:'admin',id:'fixture-admin',company_id:'fixture-company'};
window.ToyaCompanyAccess={allows:()=>true};window.ToyaProjectBusiness={isBusy:()=>false,closeEstimate:()=>true,openEstimate:async d=>{window.__previewDoc=d;}};
const cloudClient={from:table=>({select(){return this},eq(){return this},order(){return this},range(){return Promise.resolve({data:table==='estimate_plans'?window.__savedPlans:[],error:null});}}),rpc:async(name,args)=>{
window.__quoteCalls.push(name);if(name==='toya_save_estimate_plan'){const data=structuredClone(args.p_plan);const r={...data,id:args.p_id,company_id:'fixture-company',updated_at:new Date().toISOString(),created_at:new Date().toISOString(),calculation:window.ToyaEstimatePlan.calculate(data)};window.__savedPlans=[r];return {data:r,error:null};}

</script>
