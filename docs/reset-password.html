<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0b">
<title>TOYA One｜パスワード再設定</title>
<style>
:root{--lime:#b8ff00;--black:#0b0b0b;--bg:#f2f3f3;--card:#fff;--line:#d9d9d9;--muted:#707070;--danger:#b42318}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;color:#141414}
header{background:var(--black);color:#fff;border-bottom:4px solid var(--lime);padding:16px}.brand{font-size:22px;font-weight:900}.brand span{color:var(--lime)}
main{max-width:560px;margin:auto;padding:18px 14px 40px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
h1{font-size:20px;margin:0 0 8px}.note{font-size:13px;color:var(--muted);line-height:1.65;margin-bottom:14px}label{display:block;font-size:13px;font-weight:800;margin:12px 0 5px}
input{width:100%;min-height:48px;border:1px solid #bbb;border-radius:10px;padding:11px;font:inherit;background:#fff}.btn{width:100%;border:0;border-radius:10px;min-height:48px;padding:10px 14px;font-weight:900;font-size:16px;margin-top:14px}.lime{background:var(--lime);color:#111}.dark{background:#111;color:#fff}.light{background:#ececec;color:#111}.status{margin-top:14px;border-radius:10px;padding:11px;font-weight:800;font-size:13px;display:none}.ok{display:block;background:#edffd1;border:1px solid #c7ff67}.bad{display:block;background:#fff1f0;border:1px solid #ffc9c5;color:var(--danger)}.hidden{display:none}.back{display:block;text-align:center;margin-top:14px;color:#111;font-weight:800;text-decoration:none}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header><div class="brand">TOYA <span>One</span></div></header>
<main><div class="card">
<h1>パスワード再設定</h1>
<div id="requestBox">
  <div class="note">登録しているメールアドレスへ、パスワード再設定用のメールを送ります。</div>
  <label>メールアドレス</label>
  <input id="email" type="email" autocomplete="email" placeholder="メールアドレス">
  <button class="btn lime" id="sendBtn">再設定メールを送る</button>
</div>
<div id="updateBox" class="hidden">
  <div class="note">新しいパスワードを入力してください。パスワードはこのページからSupabaseへ直接送られ、TOYA OneやGitHubには保存しません。</div>
  <label>新しいパスワード</label>
  <input id="newPassword" type="password" autocomplete="new-password" minlength="8" placeholder="8文字以上">
  <label>新しいパスワード（確認）</label>
  <input id="newPassword2" type="password" autocomplete="new-password" minlength="8" placeholder="もう一度入力">
  <button class="btn dark" id="updateBtn">新しいパスワードに変更</button>
</div>
<div id="status" class="status"></div>
<a class="back" href="./">TOYA Oneへ戻る</a>
</div></main>
<script>
const SUPABASE_URL='https://hmxntxrxelswjmzghoxf.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_7wfw7ZTDsDRH0QVUuWK0mg_AVJPnffC';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const statusEl=document.getElementById('status');
const requestBox=document.getElementById('requestBox');
const updateBox=document.getElementById('updateBox');
function showStatus(msg,ok=true){statusEl.textContent=msg;statusEl.className='status '+(ok?'ok':'bad');}
async function refreshMode(){
  const {data}=await sb.auth.getSession();
  const session=data?.session;
  const qs=new URLSearchParams(location.search);
  const isRecovery=qs.get('type')==='recovery' || location.hash.includes('type=recovery') || !!session;
  if(isRecovery && session){requestBox.classList.add('hidden');updateBox.classList.remove('hidden');}
}
sb.auth.onAuthStateChange((event,session)=>{
  if(event==='PASSWORD_RECOVERY' || (session && (location.hash.includes('type=recovery') || new URLSearchParams(location.search).get('type')==='recovery'))){
    requestBox.classList.add('hidden');updateBox.classList.remove('hidden');
  }
});
document.getElementById('sendBtn').addEventListener('click',async()=>{
  const email=document.getElementById('email').value.trim();
  if(!email){showStatus('メールアドレスを入力してください。',false);return;}
  const btn=document.getElementById('sendBtn');btn.disabled=true;btn.textContent='送信中…';
  const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
  btn.disabled=false;btn.textContent='再設定メールを送る';
  if(error){showStatus('送信できませんでした：'+error.message,false);return;}
  showStatus('再設定メールを送りました。メールを開いて「Reset password」などのリンクを押してください。');
});
document.getElementById('updateBtn').addEventListener('click',async()=>{
  const p1=document.getElementById('newPassword').value;
  const p2=document.getElementById('newPassword2').value;
  if(p1.length<8){showStatus('パスワードは8文字以上にしてください。',false);return;}
  if(p1!==p2){showStatus('2つのパスワードが一致していません。',false);return;}
  const btn=document.getElementById('updateBtn');btn.disabled=true;btn.textContent='変更中…';
  const {error}=await sb.auth.updateUser({password:p1});
  btn.disabled=false;btn.textContent='新しいパスワードに変更';
  if(error){showStatus('変更できませんでした：'+error.message,false);return;}
  showStatus('パスワードを変更しました。TOYA Oneへ戻って新しいパスワードでログインしてください。');
  document.getElementById('newPassword').value='';document.getElementById('newPassword2').value='';
});
refreshMode();
</script>
</body>
</html>
