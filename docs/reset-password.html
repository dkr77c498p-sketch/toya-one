<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0b">
<title>TOYA One｜パスワード再設定</title>
<style>
:root{--lime:#b8ff00;--black:#0b0b0b;--bg:#f2f3f3;--card:#fff;--line:#d9d9d9;--muted:#707070;--danger:#b42318}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;color:#141414}
header{background:var(--black);color:#fff;border-bottom:4px solid var(--lime);padding:16px}
.brand{font-size:22px;font-weight:900}.brand span{color:var(--lime)}
main{max-width:560px;margin:auto;padding:18px 14px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
h1{font-size:20px;margin:0 0 8px}
.note{font-size:13px;color:var(--muted);line-height:1.65;margin-bottom:14px}
label{display:block;font-size:13px;font-weight:800;margin:12px 0 5px}
input{width:100%;min-height:48px;border:1px solid #bbb;border-radius:10px;padding:11px;font:inherit;background:#fff}
.btn{width:100%;border:0;border-radius:10px;min-height:48px;padding:10px 14px;font-weight:900;font-size:16px;margin-top:14px}
.lime{background:var(--lime);color:#111}.dark{background:#111;color:#fff}.light{background:#ececec;color:#111}
.status{margin-top:14px;border-radius:10px;padding:11px;font-weight:800;font-size:13px;display:none;line-height:1.55}
.ok{display:block;background:#edffd1;border:1px solid #c7ff67}
.bad{display:block;background:#fff1f0;border:1px solid #ffc9c5;color:var(--danger)}
.info{display:block;background:#f3f3f3;border:1px solid #d9d9d9;color:#333}
.hidden{display:none}
.back{display:block;text-align:center;margin-top:14px;color:#111;font-weight:800;text-decoration:none}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header><div class="brand">TOYA <span>One</span></div></header>
<main><div class="card">
<h1>パスワード再設定</h1>
<div id="requestBox">
  <div class="note">登録しているメールアドレスへ、パスワード再設定用のメールを送ります。</div>
  <label>メールアドレス</label>
  <input id="email" type="email" autocomplete="email" placeholder="メールアドレス">
  <button class="btn lime" id="sendBtn">再設定メールを送る</button>
</div>
<div id="updateBox" class="hidden">
  <div class="note">新しいパスワードを入力してください。パスワードはこのページからSupabaseへ直接送られ、TOYA OneやGitHubには保存しません。</div>
  <label>新しいパスワード</label>
  <input id="newPassword" type="password" autocomplete="new-password" minlength="8" placeholder="8文字以上">
  <label>新しいパスワード（確認）</label>
  <input id="newPassword2" type="password" autocomplete="new-password" minlength="8" placeholder="もう一度入力">
  <button class="btn dark" id="updateBtn">新しいパスワードに変更</button>
</div>
<div id="status" class="status"></div>
<a class="back" href="./">TOYA Oneへ戻る</a>
</div></main>
<script>
const SUPABASE_URL='https://hmxntxrxelswjmzghoxf.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_7wfw7ZTDsDRH0QVUuWK0mg_AVJPnffC';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{
  auth:{persistSession:true,detectSessionInUrl:true,autoRefreshToken:true,flowType:'implicit'}
});

const statusEl=document.getElementById('status');
const requestBox=document.getElementById('requestBox');
const updateBox=document.getElementById('updateBox');
const RESET_URL='https://dkr77c498p-sketch.github.io/toya-one/reset-password.html';

function showStatus(msg,type='ok'){
  statusEl.textContent=msg;
  statusEl.className='status '+type;
}
function showRequest(){requestBox.classList.remove('hidden');updateBox.classList.add('hidden');}
function showUpdate(){requestBox.classList.add('hidden');updateBox.classList.remove('hidden');}
function cleanUrl(){
  try{history.replaceState({},document.title,location.pathname);}catch(_){ }
}

async function restoreRecoverySession(){
  showStatus('認証情報を確認しています…','info');

  try{
    const qs=new URLSearchParams(location.search);
    const hash=new URLSearchParams(location.hash.replace(/^#/,''));

    // PKCE形式で code が返ってきた場合
    const code=qs.get('code');
    if(code){
      const {error}=await sb.auth.exchangeCodeForSession(code);
      if(error) throw error;
      cleanUrl();
    }

    // implicit形式のトークンがURLに残っている場合は明示的にセッション化
    const accessToken=hash.get('access_token');
    const refreshToken=hash.get('refresh_token');
    if(accessToken&&refreshToken){
      const {error}=await sb.auth.setSession({access_token:accessToken,refresh_token:refreshToken});
      if(error) throw error;
      cleanUrl();
    }

    // Supabase JSが自動復元したセッションも含めて最終確認
    const {data,error}=await sb.auth.getSession();
    if(error) throw error;

    if(data?.session){
      showUpdate();
      showStatus('本人確認できました。新しいパスワードを入力してください。','ok');
      return true;
    }

    showRequest();
    showStatus('本人確認用の情報がありません。メールの「Reset password」リンクから、このページを開き直してください。','bad');
    return false;
  }catch(e){
    console.error(e);
    showRequest();
    showStatus('認証できませんでした：'+(e?.message||e)+'。再設定メールの最新リンクから開き直してください。','bad');
    return false;
  }
}

sb.auth.onAuthStateChange((event,session)=>{
  if(event==='PASSWORD_RECOVERY'&&session){
    showUpdate();
    showStatus('本人確認できました。新しいパスワードを入力してください。','ok');
  }
});

document.getElementById('sendBtn').addEventListener('click',async()=>{
  const email=document.getElementById('email').value.trim();
  if(!email){showStatus('メールアドレスを入力してください。','bad');return;}
  const btn=document.getElementById('sendBtn');
  btn.disabled=true;btn.textContent='送信中…';
  const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:RESET_URL});
  btn.disabled=false;btn.textContent='再設定メールを送る';
  if(error){
    const msg=(error.message||'').toLowerCase();
    if(msg.includes('rate limit')) showStatus('メール送信回数の制限中です。少し時間を空けてから1回だけ試してください。','bad');
    else showStatus('送信できませんでした：'+error.message,'bad');
    return;
  }
  showStatus('再設定メールを送りました。届いたメールの「Reset password」リンクを押してください。','ok');
});

document.getElementById('updateBtn').addEventListener('click',async()=>{
  const p1=document.getElementById('newPassword').value;
  const p2=document.getElementById('newPassword2').value;
  if(p1.length<8){showStatus('パスワードは8文字以上にしてください。','bad');return;}
  if(p1!==p2){showStatus('2つのパスワードが一致していません。','bad');return;}

  const {data:sessionData,error:sessionError}=await sb.auth.getSession();
  if(sessionError||!sessionData?.session){
    showRequest();
    showStatus('認証の有効期限が切れています。最新の再設定メールからもう一度開いてください。','bad');
    return;
  }

  const btn=document.getElementById('updateBtn');
  btn.disabled=true;btn.textContent='変更中…';
  const {error}=await sb.auth.updateUser({password:p1});
  btn.disabled=false;btn.textContent='新しいパスワードに変更';

  if(error){
    if((error.message||'').toLowerCase().includes('session')){
      showRequest();
      showStatus('認証の有効期限が切れています。最新の再設定メールからもう一度開いてください。','bad');
    }else{
      showStatus('変更できませんでした：'+error.message,'bad');
    }
    return;
  }

  document.getElementById('newPassword').value='';
  document.getElementById('newPassword2').value='';
  showStatus('パスワードを変更しました。TOYA Oneへ戻って新しいパスワードでログインしてください。','ok');
});

restoreRecoverySession();
</script>
</body>
</html>
