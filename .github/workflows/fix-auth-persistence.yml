name: Fix auth persistence
on:
  push:
    paths:
      - '.github/workflows/fix-auth-persistence.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make Supabase session persistence explicit
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/index.html')
          s=p.read_text()
          old="""const cloudClient=(window.supabase&&window.supabase.createClient)\n  ? window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY)\n  : null;"""
          new="""const cloudClient=(window.supabase&&window.supabase.createClient)\n  ? window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{\n      auth:{\n        persistSession:true,\n        autoRefreshToken:true,\n        detectSessionInUrl:false,\n        storage:window.localStorage\n      }\n    })\n  : null;"""
          if old not in s:
              raise SystemExit('Supabase client target not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Keep Supabase login session persistent on iPhone'
          git push
