name: Verify bundle PDF logo on both browsers
on:
  push:
    branches: [feature/contractor-billing-bundle-20261001]
    paths: ['scripts/billing-bundle-logo-patch.py', '.github/workflows/billing-bundle-logo.yml']
permissions:
  contents: write
jobs:
  verify-and-stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install pinned isolated browser and image tools
        run: |
          (python -m pip install playwright==1.57.0 PyMuPDF==1.26.7 Pillow==11.3.0 && python -m playwright install --with-deps chromium webkit && sudo apt-get install -y fonts-noto-cjk) > /tmp/billing-install.log 2>&1 || { tail -100 /tmp/billing-install.log; exit 1; }
      - name: Apply exact bundle-only logo patch
        run: |
          python scripts/billing-bundle-logo-patch.py
          node --check docs/billing-bundle-ui.r1.js
          node --check docs/billing-bundle-pdf.r1.js
          python - <<'PY'
          from pathlib import Path
          import hashlib
          expected={'index.html':'fcfa87e762e9f5e06e2acc460e15703e37861810fb92061d1358a2b11c5768cb','billing-bundle-ui.r1.js':'a7fffa824515fbf1fb40d2b929706139c8ad2b6551b022ba25b773da0759c5bf','billing-bundle-pdf.r1.js':'771bcba41c328137e7622ea06ab56d19357305f185ceb5992829e6c2094184dc'}
          for name,sha in expected.items():assert hashlib.sha256((Path('docs')/name).read_bytes()).hexdigest()==sha,name
          PY
      - name: Repeat all synthetic accounting and UI tests with actual PDF output
        run: |
          node tests/billing-bundle.cjs
          TOYA_TEST_BROWSER=chromium python tests/billing-bundle-browser.py
          TOYA_TEST_BROWSER=webkit python tests/billing-bundle-browser.py
      - name: Require rendered company logos and complete A4 PDF pages
        run: |
          python - <<'PY'
          from pathlib import Path
          import fitz,json
          for engine in ['chromium','webkit']:
              out=Path('test-output/billing-bundle')/engine
              result=json.loads((out/'results.json').read_text());assert len(result['checks'])==43
              assert not result['new_errors'] and not result['unexpected_mock_writes']
              pdf=fitz.open(out/'TOYAONE_bundle_sample.pdf')
              assert len(pdf)==3 and pdf.metadata['title']=='TOYAONE'
              for n,page in enumerate(pdf):
                  assert abs(page.rect.width-595.27559)<.1 and abs(page.rect.height-841.88976)<.1
                  page.get_pixmap(matrix=fitz.Matrix(1.3,1.3)).save(out/f'pdf-page-{n+1}.png')
                  if n:
                      pix=page.get_pixmap(matrix=fitz.Matrix(2,2),clip=fitz.Rect(355,40,417,117),alpha=False)
                      rgb=pix.samples;green=sum(1 for i in range(0,len(rgb),3) if rgb[i+1]>rgb[i]+15 and rgb[i+1]>rgb[i+2]+15)
                      assert green>200,(engine,n,green,'Logo not visible in generated PDF')
                      print(engine,'invoice page',n+1,'visible logo pixels',green)
          PY
          git diff --exit-code -- docs/quote-pdf-export.r1.js docs/toya-document-logo.svg docs/project-business.pdf-r1.js docs/project-documents-engine.quote5-r3.js docs/site-financial-summary.js docs/company-monthly-summary.autoselect-r1.js docs/shared-site-master.names-only-r1.js
      - name: Stage only verified bundle renderer assets and test routing
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/billing-bundle-pdf.r1.js docs/billing-bundle-logo.r1.png docs/billing-bundle-ui.r1.js docs/index.html tests/billing-bundle-browser.py
          git commit -m 'Preserve company logo in WebKit bundle PDFs using namespaced exporter and exact original image crop'
          git push origin HEAD:feature/contractor-billing-bundle-20261001
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: billing-bundle-final-verification
          retention-days: 5
          path: |
            test-output/billing-bundle
            docs/billing-bundle*
            docs/project-business.bundle-r1.js
            docs/index.html
            tests/billing-bundle*
            scripts/billing-bundle-logo-patch.py
