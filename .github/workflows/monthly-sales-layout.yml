name: Apply monthly sales summary layout
on:
  push:
    branches: [fix/monthly-sales-total-profit-layout-20261105]
    paths:
      - 'docs/company-monthly-sales-layout-r1.js'
      - '.github/workflows/monthly-sales-layout.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Load verified layout after monthly summary
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path=Path('docs/index.html')
          source=path.read_text()
          tag='<script src="company-monthly-sales-layout-r1.js?v=20261105-r1"></script>'
          if tag not in source:
              source,count=re.subn(r'(<script src="company-monthly-summary\.progress-r2\.js[^"]*"></script>)',r'\1\n'+tag,source,count=1)
              if count != 1:
                  raise SystemExit('monthly summary loader was not found exactly once')
              path.write_text(source)
          PY
      - name: Verify syntax and requested labels
        run: |
          node --check docs/company-monthly-sales-layout-r1.js
          grep -F "月別の売上・合計・原価・利益" docs/company-monthly-sales-layout-r1.js
          grep -F "までの売上合計" docs/company-monthly-sales-layout-r1.js
          grep -F "その月の売上 − その月の原価" docs/company-monthly-sales-layout-r1.js
          grep -F 'company-monthly-sales-layout-r1.js?v=20261105-r1' docs/index.html
          git diff --check
      - name: Commit verified loader change
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git commit -m "Load monthly sales total and profit layout"
          git push
