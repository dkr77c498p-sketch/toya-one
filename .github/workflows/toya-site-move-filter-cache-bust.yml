name: TOYA moved site filter cache bust
on:
  push:
    paths: ['.github/workflows/toya-site-move-filter-cache-bust.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: python
        run: |
          from pathlib import Path
          p=Path('docs/index.html')
          s=p.read_text()
          old='<script src="site-move-filter-fix.js?v=20260906-1635"></script>'
          new='<script src="site-move-filter-fix.js?v=20260906-1902"></script>'
          if old not in s:
              raise SystemExit('site-move-filter-fix script tag not found')
          p.write_text(s.replace(old,new,1))
      - run: |
          git config user.name "TOYA One updater"
          git config user.email "actions@users.noreply.github.com"
          git add docs/index.html
          git commit -m "Refresh moved site filter fix" || exit 0
          git push