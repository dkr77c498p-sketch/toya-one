name: Verify completed job lifetime profit
on:
  push:
    branches: [feature/completed-job-lifetime-profit-20261013]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node tests/completed-job-lifetime-profit.cjs
      - run: node --check docs/site-period-ledger.r1.js
      - run: node --check docs/site-period-ledger-ui.r1.js
