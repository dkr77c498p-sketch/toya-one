name: Attachment name only fix
on:
  push:
    paths:
      - '.github/workflows/attachment-name-only-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch attachment labels
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/index.html')
          s=p.read_text()
          old="$('#attachmentChoices').innerHTML=ats.map(x=>`<label class=\"choice\"><input type=\"checkbox\" name=\"attachment\" value=\"${x.name}\">${x.category}｜${x.name}</label>`).join('');"
          new="$('#attachmentChoices').innerHTML=ats.map(x=>`<label class=\"choice\"><input type=\"checkbox\" name=\"attachment\" value=\"${x.name}\">${x.name}</label>`).join('');"
          if old not in s:
              raise SystemExit('target string not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Show attachment names only in daily report'
          git push
