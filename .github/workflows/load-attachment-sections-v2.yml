name: Load attachment sections v2
on:
  push:
    paths:
      - '.github/workflows/load-attachment-sections-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add attachment sections script
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('docs/index.html')
          s=p.read_text()
          tag='<script src="attachment-sections-v2.js?v=20260908-1632"></script>'
          if tag in s:
              raise SystemExit(0)
          m=re.search(r'(<script src="site-move-filter-fix\.js\?v=[^"]+"></script>)',s)
          if not m:
              raise SystemExit('site fix script tag not found')
          s=s[:m.end()]+"\n"+tag+s[m.end():]
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Load separated attachment admin sections'
          git push
