name: Verify monthly current totals and waste autofill
on:
  push:
    branches: [feature/monthly-site-current-totals-waste-autofill-20261107]
    paths:
      - 'scripts/apply_monthly_current_totals_waste_autofill.py'
      - '.github/workflows/monthly-current-totals-waste-autofill.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-and-stage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Apply reviewed integration patch
        run: python scripts/apply_monthly_current_totals_waste_autofill.py
      - name: Verify JavaScript syntax
        run: |
          node --check docs/company-per-site-sales-r2.js
          node --check docs/waste-price-autofill-r1.js
          node --check docs/site-period-ledger-ui.r1.js
      - name: Verify calculation engine remains intact
        run: |
          node tests/completed-job-lifetime-profit.cjs
          node tests/monthly-profit-issued-progress.cjs
      - name: Verify requested behavior is present
        run: |
          grep -F "現在の現場合計" docs/company-per-site-sales-r2.js
          grep -F "月ごとの売上・原価・利益を見る" docs/company-per-site-sales-r2.js
          grep -F "summaries(siteIds=[]" docs/site-period-ledger-ui.r1.js
          grep -F "前回使った処分場・品目は次回から自動表示" docs/waste-price-autofill-r1.js
          grep -F 'company-per-site-sales-r2.js?v=20261107-current-totals-r1' docs/index.html
          grep -F 'waste-price-autofill-r1.js?v=20261107-r1' docs/index.html
          if grep -Fq 'company-monthly-sales-layout-r1.js?v=20261105-stable-r2' docs/index.html; then exit 1; fi
          git diff --check
      - name: Commit exact verified runtime files
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/site-period-ledger-ui.r1.js
          git commit -m "Connect per-site current totals and waste autofill"
          git push
