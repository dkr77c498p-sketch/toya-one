name: TOYA One v5.4.0 waste dashboard
on:
  push:
    paths:
      - '.github/workflows/toya-v5-4-0-waste-dashboard.yml'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply waste dashboard patch
        run: python .github/scripts/toya_patch_v540_waste_dashboard.py
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('docs/index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,flags=re.S|re.I)
          Path('/tmp/toya-inline.js').write_text('\n'.join(blocks),encoding='utf-8')
          PY
          node --check /tmp/toya-inline.js
      - name: Commit upgrade
        run: |
          git config user.name "TOYA One updater"
          git config user.email "actions@users.noreply.github.com"
          git add docs/index.html docs/TOYA_One_v5_2_0_calendar_edit.html docs/TOYA_One_v5_1_0_cloud_shared.html
          git commit -m "Add monthly waste and manifest dashboard" || exit 0
          git push
# retry after call-site fix
