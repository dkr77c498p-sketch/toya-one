name: Stage approved quotation overhead default
on:
  push:
    branches: [work/quote-options-20260923]
    paths:
      - '.github/workflows/stage-quote-options.yml'
permissions:
  contents: write
concurrency:
  group: isolated-quote-options-v1
  cancel-in-progress: false
jobs:
  verify-and-stage:
    if: github.ref == 'refs/heads/work/quote-options-20260923'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/quote-options-20260923
          fetch-depth: 1
      - name: Apply only the approved new-input default
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          cp docs/project-documents-engine.js "$RUNNER_TEMP/quote-invoice-baseline.cjs"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, subprocess
          p=Path('docs/estimate-auto-builder.js')
          b=p.read_bytes()
          assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()=='fc3165162210c00b7755dd62192f767c44f8a080'
          s=b.decode()
          old="overhead_rate:'',welfare_rate:'0'"
          assert s.count(old)==1
          s=s.replace(old,"overhead_rate:'5',welfare_rate:'0'",1)
          old="if(kind==='overhead')Object.assign(r,{auto_percent:'quote_overhead_v1',overhead_rate:'',overhead_mode:'rate'});"
          assert s.count(old)==1
          s=s.replace(old,"if(kind==='overhead')Object.assign(r,{auto_percent:'quote_overhead_v1',overhead_rate:groups.find(g=>g.auto_input)?.auto_input?.overhead_rate??defaults().overhead_rate,overhead_mode:'rate'});",1)
          p.write_text(s)
          p=Path('tests/quote-options-v1.cjs');s=p.read_text()
          old="assert.equal(A.defaults().overhead_rate,'');"
          assert s.count(old)==1
          s=s.replace(old,"assert.equal(A.defaults().overhead_rate,'5');",1)
          s=s.replace("test('new overhead requires a rate instead of inventing one'","test('explicitly clearing the approved default leaves overhead incomplete'",1)
          s+=r'''
          test('approved default is five percent for new overhead inputs',()=>{
            assert.equal(A.defaults().overhead_rate,'5');
            const p=draft(),before=JSON.stringify(p.groups),n=A.ensureQuoteCharge(p.groups,'overhead');
            assert.equal(JSON.stringify(p.groups),before);
            p.groups=n.groups;
            assert.equal(p.groups[n.groupIndex].quote_lines[n.rowIndex].overhead_rate,'5');
            calculate(p);assert.equal(A.quoteSummary(p.groups).overhead,6735);
            assert.equal(Q.calculate(p).price,141435);
          });
          test('a million yen direct work calculates fifty thousand overhead',()=>{
            const p=draft();p.groups[1].quote_lines[0].quote_price='1000000';
            p.groups=A.ensureQuoteCharge(p.groups,'overhead').groups;
            calculate(p);assert.equal(A.quoteSummary(p.groups).overhead,50000);
          });
          test('existing per-quote zero, blank, and custom rates are retained',()=>{
            for(const rate of ['0','','3.5','10']){
              const p=draft();p.groups[0].auto_input={kind:'wood',overhead_rate:rate};
              const before=JSON.stringify(p.groups),n=A.ensureQuoteCharge(p.groups,'overhead');
              assert.equal(JSON.stringify(p.groups),before);
              assert.equal(n.groups[n.groupIndex].quote_lines[n.rowIndex].overhead_rate,rate);
              assert.equal(A.normalize({overhead_rate:rate}).overhead_rate,rate);
            }
          });
          test('opening an existing manual or rate-based overhead does not reset it to five',()=>{
            for(const rate of ['0','','7']){
              const p=draft();charge(p,'overhead',rate);calculate(p);
              const before=JSON.stringify(p.groups),n=A.ensureQuoteCharge(p.groups,'overhead');
              assert.equal(JSON.stringify(n.groups),before);
            }
            const p=draft();p.groups[4].quote_lines=[row('諸経費',9000)];
            const before=JSON.stringify(p.groups),n=A.ensureQuoteCharge(p.groups,'overhead');
            assert.equal(JSON.stringify(n.groups),before);
            assert.equal(Q.calculate({...p,groups:n.groups}).price,143700);
          });
          test('default rate can still be changed or switched to a manual amount',()=>{
            const p=draft(),n=A.ensureQuoteCharge(p.groups,'overhead');p.groups=n.groups;
            p.groups[n.groupIndex].quote_lines[n.rowIndex].overhead_rate='3';
            calculate(p);assert.equal(A.quoteSummary(p.groups).overhead,4041);
            p.groups=A.setQuoteOverheadMode(p.groups,n.groupIndex,n.rowIndex,'amount');
            p.groups[n.groupIndex].quote_lines[n.rowIndex].quote_amount='5000';
            calculate(p);assert.equal(A.quoteSummary(p.groups).overhead,5000);
          });
          test('loading, printing or duplicating a saved quote does not add overhead',()=>{
            const p=draft(),before=JSON.stringify(p);
            calculate(p);D.printHTML(document(p));
            const copied=Q.duplicate(p,null);
            assert.equal(JSON.stringify(p),before);
            assert.equal(A.quoteSummary(p.groups).overhead,0);
            assert.equal(A.quoteSummary(copied.groups).overhead,0);
          });
          '''
          p.write_text(s)
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changed=={'docs/estimate-auto-builder.js','tests/quote-options-v1.cjs'},changed
          PY
      - name: Verify syntax and all quotation regressions offline
        shell: bash
        run: |
          set -euo pipefail
          node --check docs/estimate-auto-builder.js
          TOYA_QUOTE_BASELINE="$RUNNER_TEMP/quote-invoice-baseline.cjs" node --test tests/quote-options-v1.cjs
      - name: Commit verified defaults to the work branch only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/work/quote-options-20260923'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/estimate-auto-builder.js tests/quote-options-v1.cjs
          git diff --cached --check
          git commit -m 'Use approved 5 percent overhead for new quotation inputs; preserve saved quotes'
          git push origin HEAD:refs/heads/work/quote-options-20260923
          echo 'Verified 5 percent default on work branch only. No deployment, credentials, employee or database changes.' >> "$GITHUB_STEP_SUMMARY"
