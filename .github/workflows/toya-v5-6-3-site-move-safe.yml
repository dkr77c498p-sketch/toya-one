name: TOYA One v5.6.3 safe site move

on:
  push:
    paths:
      - '.github/workflows/toya-v5-6-3-site-move-safe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch site move workflow
        shell: python
        run: |
          from pathlib import Path
          import base64
          files=[Path('docs/TOYA_One_v5_1_0_cloud_shared.html'),Path('docs/TOYA_One_v5_2_0_calendar_edit.html'),Path('docs/index.html')]
          old=base64.b64decode('').decode()
          new=base64.b64decode('').decode()
          for path in files:
              text=path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'expected site move block not found: {path}')
              text=text.replace(old,new,1).replace('v5.6.2','v5.6.3')
              path.write_text(text,encoding='utf-8')
      - name: Commit changes
        run: |
          git config user.name "TOYA One updater"
          git config user.email "actions@users.noreply.github.com"
          git add docs/TOYA_One_v5_1_0_cloud_shared.html docs/TOYA_One_v5_2_0_calendar_edit.html docs/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix site move autosave and show all registered sites"
          git push
