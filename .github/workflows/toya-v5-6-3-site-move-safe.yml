name: TOYA One v5.6.3 safe site move

on:
  push:
    paths:
      - '.github/workflows/toya-v5-6-3-site-move-safe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch site move workflow
        shell: python
        run: |
          from pathlib import Path
          files=[Path('docs/TOYA_One_v5_1_0_cloud_shared.html'),Path('docs/TOYA_One_v5_2_0_calendar_edit.html'),Path('docs/index.html')]
          lines=[
            "async function saveCurrentReportBeforeMove(){",
            "  const d=collect();",
            "  if(!validate(d))return false;",
            "  try{",
            "    const addedPhotos=await savePhotosForReport(d.id);",
            "    d.photoCount=Number(editingReport?.photoCount||0)+Number(addedPhotos||0);",
            "    const a=get(LS.reports,[]);",
            "    const editIndex=editingReport?a.findIndex(x=>String(x.id)===String(editingReport.id)):-1;",
            "    if(editIndex>=0)a[editIndex]=d; else a.unshift(d);",
            "    set(LS.reports,a);",
            "    populateLedgerSites();",
            "    localStorage.removeItem(LS.draft);",
            "    stagedPhotos=[];",
            "    renderStagedPhotos();",
            "    if(cloudProfile){",
            "      try{",
            "        const cloudResult=await cloudSaveReport(d);",
            "        const photoResult=await cloudSyncPhotosForReport(d.id,cloudResult?.id);",
            "        const wasteResult=await cloudSyncWasteForReport(d,cloudResult?.id);",
            "        await cloudLogActivity('report_save',cloudResult?.id,{site:d.site,date:d.date,reason:'site_move'});",
            "        if(photoResult.ok)await cloudLogActivity('photo_save',cloudResult?.id,{count:photoResult.ok});",
            "        if(wasteResult.ok)await cloudLogActivity('waste_save',cloudResult?.id,{count:wasteResult.ok});",
            "        await cloudLoadReports();",
            "      }catch(cloudErr){console.error(cloudErr);cloudMsg('1現場目は端末に保存しましたが、クラウド同期に失敗：'+(cloudErr?.message||cloudErr),'warn');}",
            "    }",
            "    clearReportEditState();",
            "    return true;",
            "  }catch(err){console.error(err);alert('1現場目を保存できなかったため、現場移動を中止しました。入力内容はそのまま残っています。');return false;}",
            "}",
            "",
            "async function applyMovedSite(selected){",
            "  const current=collect();",
            "  const saved=await saveCurrentReportBeforeMove();",
            "  if(!saved)return;",
            "  closeSiteMovePicker();",
            "  $('#site').value=selected;",
            "  $('#details').value='';$('#memo').value='';$('#start').value=current.end||'13:00';$('#end').value='17:00';$('#overtime').value=0;",
            "  $('#items').innerHTML='';addItem();if($('#fuelRows'))$('#fuelRows').innerHTML='';",
            "  editingCloudReportId=null;editingLocalReportId=null;editingOriginalCreatorId=null;editingOriginalCreatorName='';updateEditBanner();",
            "  window.scrollTo({top:0,behavior:'smooth'});",
            "  setTimeout(()=>alert('1現場目を保存しました。移動先「'+selected+'」の日報入力に切り替えました。'),200);",
            "}",
            "",
            "function createMovedSiteReport(){",
            "  const current=collect();",
            "  const localSites=get(LS.sites,[]);",
            "  const cloudSites=(cloudProfile?cloudSitesCache:[]).filter(x=>x&&x.status!=='inactive').map(x=>x.name);",
            "  const selectSites=$('#site')?[...$('#site').options].map(o=>o.value):[];",
            "  const sites=[...new Set([...cloudSites,...selectSites,...localSites].map(x=>String(x||'').trim()).filter(Boolean))];",
            "  const choices=sites.filter(x=>x!==current.site&&x!=='現場名をあとで変更'&&x!=='未登録現場');",
            "  if(!choices.length){alert('別の現場がまだ登録されていません。先に現場を登録してください。');return;}",
            "  openSiteMovePicker(choices);",
            "}",
            ""
          ]
          new='\n'.join(lines)
          for path in files:
              text=path.read_text(encoding='utf-8')
              start=text.index('function applyMovedSite(selected){')
              end=text.index('function setTimeQuick',start)
              text=text[:start]+new+text[end:]
              text=text.replace('v5.6.2','v5.6.3')
              path.write_text(text,encoding='utf-8')
      - name: Commit changes
        run: |
          git config user.name "TOYA One updater"
          git config user.email "actions@users.noreply.github.com"
          git add docs/TOYA_One_v5_1_0_cloud_shared.html docs/TOYA_One_v5_2_0_calendar_edit.html docs/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix site move autosave and show all registered sites"
          git push
