name: Attachment friendly labels
on:
  push:
    paths:
      - '.github/workflows/attachment-friendly-labels.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch machine attachment labels
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/index.html')
          s=p.read_text()
          old="$('#machineAttachmentChoices').innerHTML=machineAts.map(x=>`<label class=\"choice\"><input type=\"checkbox\" name=\"attachment\" value=\"${x.name}\">${x.name}</label>`).join('');"
          new="$('#machineAttachmentChoices').innerHTML=machineAts.map(x=>`<label class=\"choice\"><input type=\"checkbox\" name=\"attachment\" value=\"${x.name}\">${x.category?x.category+'｜':''}${x.name}</label>`).join('');"
          if old not in s:
              raise SystemExit('target string not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Show attachment type with machine attachment name'
          git push
