name: Read-only login diagnostic
on:
  push:
    branches: [repair/login-readonly-diagnostic-20260921]
    paths: [.github/workflows/login-readonly-diagnostic.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Prepare isolated browser tests
        run: |
          mkdir -p diagnostic-output
          npm install --no-save --ignore-scripts playwright@1.55.1
          npx playwright install --with-deps chromium webkit
      - name: Inspect public page and test login without accessing Supabase
        shell: bash
        run: |
          cat > diagnostic.cjs <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const crypto = require('node:crypto');
          const { chromium, webkit } = require('playwright');
          const base = 'https://dkr77c498p-sketch.github.io/toya-one/';
          const output = [];
          const sha = text => crypto.createHash('sha1').update('blob ' + Buffer.byteLength(text) + '\0').update(text).digest('hex');
          (async () => {
            for (const path of ['', 'recovery.html']) {
              const url = base + path + '?readonly_diagnostic=' + Date.now();
              const response = await fetch(url, { signal: AbortSignal.timeout(30000) });
              const html = await response.text();
              const label = path || 'index.html';
              const result = { page: label, url, status: response.status, gitBlobSha: sha(html), lastModified: response.headers.get('last-modified'), scripts: [], browsers: [] };
              output.push(result);
              console.log('PAGE', JSON.stringify({ page: label, status: response.status, gitBlobSha: result.gitBlobSha, lastModified: result.lastModified }));
              if (!response.ok) continue;
              fs.writeFileSync('diagnostic-output/' + label, html);
              let number = 0;
              for (const match of html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script\s*>/gi)) {
                const src = match[1].match(/\bsrc\s*=\s*["']([^"']+)["']/i)?.[1];
                const item = { name: src || 'inline-' + (++number) };
                let code = match[2];
                if (src) {
                  const absolute = new URL(src, url);
                  if (!['dkr77c498p-sketch.github.io', 'cdn.jsdelivr.net'].includes(absolute.hostname)) continue;
                  try {
                    const resource = await fetch(absolute, { signal: AbortSignal.timeout(30000) });
                    item.status = resource.status; code = await resource.text();
                    if (absolute.hostname === 'cdn.jsdelivr.net') fs.writeFileSync('diagnostic-output/supabase-sdk.js', code);
                  } catch (error) { item.error = String(error); result.scripts.push(item); continue; }
                }
                try { new vm.Script(code, { filename: item.name }); item.syntax = 'OK'; }
                catch (error) { item.syntax = String(error); item.stack = error.stack; }
                result.scripts.push(item);
                if (item.syntax !== 'OK' || item.status && item.status !== 200) console.log('SCRIPT', JSON.stringify(item));
              }
              for (const [name, engine] of [['chromium', chromium], ['webkit', webkit]]) {
                const browser = await engine.launch({ headless: true });
                const context = await browser.newContext({ viewport: { width: 390, height: 844 }, isMobile: true, hasTouch: true });
                const page = await context.newPage();
                const observed = { engine: name, errors: [], failedRequests: [], interceptedAuthRequests: 0 };
                result.browsers.push(observed);
                // No request can reach a real Supabase account or database.
                await context.route('**/*', async route => {
                  const request = route.request(), u = new URL(request.url());
                  if (u.hostname.endsWith('.supabase.co') || u.hostname.endsWith('.supabase.in')) {
                    if (u.pathname.endsWith('/auth/v1/token')) observed.interceptedAuthRequests++;
                    return route.fulfill({ status: 400, contentType: 'application/json', body: JSON.stringify({ code: 'invalid_credentials', message: 'READ_ONLY_TEST_AUTH_REACHED', msg: 'READ_ONLY_TEST_AUTH_REACHED' }) });
                  }
                  if (!['dkr77c498p-sketch.github.io', 'cdn.jsdelivr.net'].includes(u.hostname)) return route.abort();
                  return route.continue();
                });
                page.on('pageerror', error => observed.errors.push({ message: error.message, stack: error.stack }));
                page.on('requestfailed', request => observed.failedRequests.push({ url: request.url(), error: request.failure()?.errorText }));
                page.on('dialog', dialog => dialog.dismiss());
                try {
                  await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 45000 });
                  await page.waitForTimeout(1800);
                  observed.initial = await page.evaluate(() => ({ status: document.querySelector('#cloudStatus')?.textContent, loginFunction: typeof cloudLogin, client: typeof cloudClient, readyState: document.readyState }));
                  await page.screenshot({ path: 'diagnostic-output/' + label + '-' + name + '.png' });
                  await page.locator('#cloudEmail').fill('readonly-test@example.invalid');
                  await page.locator('#cloudPassword').fill('not-a-real-account-password');
                  const button = page.locator('#cloudLoggedOut button').filter({ hasText: 'ログイン' }).first();
                  await button.click({ timeout: 5000 });
                  await page.waitForTimeout(1800);
                  observed.afterClick = await page.locator('#cloudStatus').textContent();
                } catch (error) { observed.testError = String(error); }
                console.log('BROWSER', JSON.stringify({ page: label, ...observed }));
                await browser.close();
              }
              fs.writeFileSync('diagnostic-output/result.json', JSON.stringify(output, null, 2));
            }
          })().catch(error => { console.error(error); fs.writeFileSync('diagnostic-output/result.json', JSON.stringify(output, null, 2)); process.exitCode = 1; });
          NODE
          node diagnostic.cjs
      - name: Preserve public-code diagnostic results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readonly-login-diagnostic
          path: diagnostic-output/
          retention-days: 3
