name: Enable isolated labor cost administration
on:
  push:
    paths:
      - '.github/workflows/enable-labor-admin-v1.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: toya-enable-labor-admin-v1
  cancel-in-progress: false
jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify tested files and add only script reference
        run: |
          node --check docs/labor-cost-admin.js
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          p=Path('docs/index.html')
          before=p.read_text()
          tag='<script src="labor-cost-admin.js?v=20260908-labor-v1"></script>'
          if tag in before:
              print('Already enabled; no change')
          else:
              actual=subprocess.check_output(['git','hash-object','docs/index.html'],text=True).strip()
              assert actual=='59cf0e005cb551ad684af48cfe70eb04b212b3bd', 'App changed since verification; stop for review'
              module=subprocess.check_output(['git','hash-object','docs/labor-cost-admin.js'],text=True).strip()
              assert module=='59a48082592de75d4346c3f220001e238f31bb35', 'Module differs from tested content'
              assert before.count('</body>')==1
              after=before.replace('</body>',tag+'\n</body>')
              assert after.replace(tag+'\n','')==before
              p.write_text(after)
          PY
      - name: Commit the isolated loader
        run: |
          if git diff --quiet -- docs/index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/index.html
          git commit -m 'Load isolated admin labor cost module; preserve existing auth and report saves'
          git push
