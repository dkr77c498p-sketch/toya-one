name: Enable unified site selectors v3
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/enable-site-selectors-v3.yml
      - scripts/enable-site-selectors-v3.py
      - scripts/selector-helpers-v3.js
      - scripts/selector-apply-shared-v3.py
      - scripts/selector-apply-views-v3.py
      - scripts/test-site-selectors-v3.cjs
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: toya-unified-site-selectors-v3
  cancel-in-progress: false
jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align old saved-only test expectations with the already-live automatic summary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('tests/site-financial-summary.test.cjs')
          def blob(b):return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          before='d4ec86e8c23536581fb06e3eb91ef53820f63acd'
          after='2568c740303ddeb9e887ffa5df17938e12459e0e'
          b=p.read_bytes()
          if blob(b)==before:
              s=b.decode()
              s=s.replace("x.categories.labor.missingDates,['2026-09-08']","x.categories.labor.reviewDates,['2026-09-08']")
              s=s.replace("d.reports[0].site_id='site-b';d.reports[0].report_data.siteMoves","d.reports[0].site_id='site-b';d.reports[0].report_data.site='テスト現場B';d.reports[0].report_data.siteMoves")
              s=s.replace('x.categories.vehicle.missingDates.length,1','x.categories.vehicle.reviewDates.length,1').replace('x.categories.labor.missingDates.length,1','x.categories.labor.reviewDates.length,1')
              if blob(s.encode())!=after:raise RuntimeError('Unexpected test fixture result')
              p.write_text(s)
          elif blob(b)!=after:raise RuntimeError('Tests changed concurrently')
          PY
      - name: Match browser-tested files and verify all regressions
        run: python3 scripts/enable-site-selectors-v3.py
      - name: Publish verified selectors atomically
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/index.html docs/shared-site-master.js docs/midway.js docs/site-move-filter-fix.js docs/site-waste-cost-summary.js docs/labor-cost-admin.js docs/vehicle-cost-admin.js docs/equipment-cost-admin.js docs/employee-activity-summary.js docs/site-financial-summary.js tests/shared-site-master.cjs tests/site-selector-unified.cjs tests/site-financial-summary.test.cjs
          if git diff --cached --quiet; then echo 'Already enabled'; exit 0; fi
          git diff --cached --stat
          git commit -m 'Unify shared site selectors across reports, home and cost editors while preserving history and verified saves'
          git push origin HEAD:main
