name: Verify combined green invoice sheet
on:
  push:
    branches: [feature/combined-invoice-sheet-20261005]
    paths:
      - docs/billing-combined-sheet.r1.js
      - scripts/invoice-combined-patch.py
      - tests/invoice-combined.cjs
      - tests/invoice-combined-browser.py
      - .github/workflows/invoice-combined.yml
permissions:
  contents: write
jobs:
  verify-and-stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Apply exact reviewed display-only changes
        run: |
          python scripts/invoice-combined-patch.py
          node --check docs/billing-combined-sheet.r1.js
          node --check docs/billing-bundle-ui.combined-r1.js
          python - <<'PY'
          import hashlib
          from pathlib import Path
          expected={'billing-bundle-ui.combined-r1.js':'151e0496e7409e004f85c7076c327ffca88902d9f86ce6eeb3536cd2c8a29f4b','billing-combined-sheet.r1.js':'10d52a826dc2133500ddc7f526ed5313b82357c1c165e0e272945591d572d340','index.html':'0d7a97b954e1168cf1681f3e250e7d35fb62f3dd65822f1f426f0e1b2628984d'}
          for name,value in expected.items():
              assert hashlib.sha256((Path('docs')/name).read_bytes()).hexdigest()==value,name
          PY
      - name: Install pinned isolated-browser verification tools
        run: |
          python -m pip install playwright==1.57.0 PyMuPDF==1.26.7 >/tmp/combined-install.log 2>&1 || { tail -60 /tmp/combined-install.log; exit 1; }
          python -m playwright install --with-deps chromium webkit >>/tmp/combined-install.log 2>&1 || { tail -60 /tmp/combined-install.log; exit 1; }
          sudo apt-get install -y fonts-noto-cjk >>/tmp/combined-install.log 2>&1 || { tail -60 /tmp/combined-install.log; exit 1; }
      - name: Test current-portion billing, new default PDF and legacy workflows without accounts
        run: |
          node tests/invoice-combined.cjs
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/billing-bundle-browser.py')
          s=p.read_text()
          anchor="click('#bbPreview');page.wait_for_selector('#bbPreviewDialog[open]')"
          assert s.count(anchor)>=1
          # The default is intentionally now a single sheet. Test the legacy
          # mode by selecting it explicitly, keeping all old assertions.
          s=s.replace(anchor,"page.locator('#bbPrintFormat').select_option('attachments');"+anchor,1)
          Path('tests/billing-bundle-legacy-browser.py').write_text(s)
          PY
          for browser in chromium webkit; do
            TOYA_TEST_BROWSER=$browser python tests/invoice-combined-browser.py
            TOYA_TEST_BROWSER=$browser python tests/invoice-a4-browser.py
            TOYA_TEST_BROWSER=$browser python tests/invoice-green-browser.py
            TOYA_TEST_BROWSER=$browser python tests/billing-bundle-legacy-browser.py
          done
      - name: Verify PDF paper sizes and unchanged original modules
        run: |
          python - <<'PY'
          from pathlib import Path
          import fitz,json,hashlib,subprocess
          files=list(Path('test-output/invoice-combined').glob('*/*.pdf'))
          assert len(files)>=4
          for p in files:
              doc=fitz.open(p)
              assert len(doc)>0
              for page in doc:
                  assert abs(page.rect.width-595.27559)<1 and abs(page.rect.height-841.88976)<1,(str(p),page.rect)
              if p.name in ('combined.pdf','three-sites-print.pdf'):
                  assert len(doc)==1,(str(p),len(doc))
                  doc[0].get_pixmap(matrix=fitz.Matrix(1.5,1.5)).save(str(p.with_suffix('.png')))
              if p.name=='combined.pdf':assert doc.metadata['title']=='TOYAONE'
          for p in Path('test-output/invoice-combined').glob('*/results.json'):
              result=json.loads(p.read_text());assert not result['new_errors'] and not result['unexpected_writes']
          changed=subprocess.check_output(['git','diff','--name-only']).decode().splitlines()
          assert changed==['docs/index.html'],changed
          hashes={name:hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in ['docs/index.html','docs/billing-combined-sheet.r1.js','docs/billing-bundle-ui.combined-r1.js']}
          Path('test-output/invoice-combined/runtime-hashes.json').write_text(json.dumps(hashes,indent=2))
          PY
      - name: Stage only tested runtime integration on feature branch
        run: |
          test "$GITHUB_REF_NAME" = 'feature/combined-invoice-sheet-20261005'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/index.html docs/billing-bundle-ui.combined-r1.js
          git commit -m 'Stage verified single-sheet combined invoice display'
          git push origin HEAD:feature/combined-invoice-sheet-20261005
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: invoice-combined-verification
          retention-days: 5
          path: |
            test-output/invoice-combined
            test-output/invoice-a4
            test-output/invoice-green
            test-output/billing-bundle
            docs/index.html
            docs/billing-combined-sheet.r1.js
            docs/billing-bundle-ui.combined-r1.js
