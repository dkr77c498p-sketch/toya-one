name: Verify monthly profit work-month fallback
on:
  push:
    branches: [fix/monthly-profit-issued-progress-20261013]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node tests/monthly-profit-issued-progress.cjs
      - run: node --check docs/company-monthly-summary.autoselect-r1.js
