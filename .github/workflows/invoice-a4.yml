name: Verify single invoice A4 preview and PDF
on:
  push:
    branches: [fix/invoice-a4-preview-20261002]
    paths: ['scripts/invoice-a4-patch.py', 'tests/invoice-a4-browser.py', '.github/workflows/invoice-a4.yml']
permissions:
  contents: write
jobs:
  verify-and-stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Apply only reviewed display and PDF changes to versioned copies
        run: |
          python scripts/invoice-a4-patch.py
          node --check docs/project-business.a4-r1.js
          node --check docs/billing-bundle-ui.a4-r1.js
          python - <<'PY'
          from pathlib import Path
          import hashlib
          expected={'project-business.a4-r1.js':'876f70d5ec07b74e58a913a98e920635eb83e35804dff2d18ac9f18a0b0837e2','billing-bundle-ui.a4-r1.js':'0d96b2c6f1bd483745c6f8fc9b514e3e9a8a07075fb5f024540cd5840a457ead','index.html':'ecb10a7dc6ac2501a1f51cd223320878d1b026bd8ae62b14a8466fd690e93943'}
          for name,digest in expected.items():
              assert hashlib.sha256((Path('docs')/name).read_bytes()).hexdigest()==digest,name
          PY
      - name: Install isolated browser tools
        run: |
          python -m pip install playwright==1.57.0 PyMuPDF==1.26.7 >/tmp/a4-install.log 2>&1 || { tail -60 /tmp/a4-install.log; exit 1; }
          python -m playwright install --with-deps chromium webkit >>/tmp/a4-install.log 2>&1 || { tail -60 /tmp/a4-install.log; exit 1; }
          sudo apt-get install -y fonts-noto-cjk >>/tmp/a4-install.log 2>&1 || { tail -60 /tmp/a4-install.log; exit 1; }
      - name: Test existing bundle calculations and both new single-document workflows
        run: |
          node tests/billing-bundle.cjs
          TOYA_TEST_BROWSER=chromium python tests/invoice-a4-browser.py
          TOYA_TEST_BROWSER=webkit python tests/invoice-a4-browser.py
          TOYA_TEST_BROWSER=chromium python tests/billing-bundle-browser.py
          TOYA_TEST_BROWSER=webkit python tests/billing-bundle-browser.py
      - name: Verify real PDF media sizes and render every single-page case
        run: |
          python - <<'PY'
          from pathlib import Path
          import fitz,json
          for engine in ['chromium','webkit']:
              out=Path('test-output/invoice-a4')/engine
              r=json.loads((out/'results.json').read_text())
              assert not r['writes'] and not r['new_errors']
              assert len(r['checks'])>=60
              for name in ['draft-progress','b','a','void']:
                  pdf=fitz.open(out/(name+'.pdf'))
                  assert len(pdf)==1 and pdf.metadata['title']=='TOYAONE',name
                  p=pdf[0]
                  assert abs(p.rect.width-595.27559)<.1 and abs(p.rect.height-841.88976)<.1,name
                  p.get_pixmap(matrix=fitz.Matrix(1.3,1.3)).save(out/(name+'-pdf.png'))
                  if engine=='chromium':
                      printed=fitz.open(out/(name+'-print.pdf'))
                      assert len(printed)==1,name+' print blank page'
                      assert abs(printed[0].rect.width-595.27559)<1 and abs(printed[0].rect.height-841.88976)<1
              if engine=='chromium':
                  long=fitz.open(out/'long-print.pdf')
                  assert len(long)>1
                  text=''.join(p.get_text() for p in long)
                  assert '88,000' in text
                  for p in long:
                      assert abs(p.rect.width-595.27559)<1 and abs(p.rect.height-841.88976)<1
              b=json.loads((Path('test-output/billing-bundle')/engine/'results.json').read_text())
              assert len(b['checks'])>=43 and not b['new_errors'] and not b['unexpected_mock_writes']
              print(engine, len(r['checks']), 'single invoice checks plus',len(b['checks']),'existing bundle checks passed; real A4 PDFs verified')
          PY
          git diff --exit-code -- docs/project-business.bundle-r1.js docs/billing-bundle-ui.r1.js docs/project-documents-engine.quote5-r3.js docs/billing-bundle-pdf.r1.js docs/quote-pdf-export.r1.js docs/site-financial-summary.js docs/company-monthly-summary.autoselect-r1.js
      - name: Stage tested source changes on feature branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/index.html docs/project-business.a4-r1.js docs/billing-bundle-ui.a4-r1.js
          git commit -m 'Stage verified A4 portrait single invoice preview and PDF; original financial data unchanged'
          git push origin HEAD:fix/invoice-a4-preview-20261002
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: invoice-a4-verification
          retention-days: 5
          path: |
            test-output/invoice-a4
            test-output/billing-bundle
            docs/index.html
            docs/project-business.a4-r1.js
            docs/billing-bundle-ui.a4-r1.js
