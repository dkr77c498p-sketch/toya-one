name: Safely link waste price admin

on:
  push:
    paths:
      - '.github/workflows/safe-waste-price-admin-link.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add external admin script only
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/index.html')
          s = p.read_text(encoding='utf-8')
          target = '<script src="waste-price-master.js?v=20260908-1200"></script>'
          admin = '<script src="waste-price-admin.js?v=20260908-1155"></script>'
          if target not in s:
              raise SystemExit('waste price master script not found; refusing to modify')
          if admin not in s:
              s = s.replace(target, target + '\n' + admin, 1)
          if s.count(admin) != 1:
              raise SystemExit('unexpected admin script count')
          if s.count(target) != 1:
              raise SystemExit('unexpected master script count')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Show minimal diff
        run: git diff -- docs/index.html
      - name: Commit
        run: |
          git config user.name "TOYA One updater"
          git config user.email "actions@users.noreply.github.com"
          git add docs/index.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Safely link waste price admin"
          git push
