name: Cache bust site fix
on:
  push:
    paths:
      - '.github/workflows/cache-bust-site-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump site fix script version
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/index.html')
          s=p.read_text()
          old='site-move-filter-fix.js?v=20260908-1455'
          new='site-move-filter-fix.js?v=20260908-1501'
          if old not in s:
              raise SystemExit('target script version not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Bust cached site fix script for tool quantities v1501'
          git push
