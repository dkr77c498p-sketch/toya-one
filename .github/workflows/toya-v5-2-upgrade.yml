name: TOYA One v5.2 upgrade

on:
  push:
    paths:
      - '.github/workflows/toya-v5-2-upgrade.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply TOYA One v5.2 patch
        run: python .github/scripts/toya_patch_v52.py
      - name: Commit upgrade
        run: |
          git config user.name "TOYA One updater"
          git config user.email "actions@users.noreply.github.com"
          git add docs/index.html docs/TOYA_One_v5_1_0_cloud_shared.html docs/TOYA_One_v5_2_0_calendar_edit.html
          git commit -m "Upgrade TOYA One to v5.2 calendar edit delete" || exit 0
          git push
