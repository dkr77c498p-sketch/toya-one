name: TOYA One v5.2 validate

on:
  push:
    paths:
      - '.github/workflows/toya-v5-2-upgrade.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('docs/index.html').read_text(encoding='utf-8')
          start=s.index('<script>')+len('<script>')
          end=s.rindex('</script>')
          Path('/tmp/toya.js').write_text(s[start:end],encoding='utf-8')
          for needle in ['deleteCloudReport','editCloudReport','renderRecordCalendar','duplicateCloudReport','setReportDateOffset']:
              assert needle in s, needle
          print('feature markers ok')
          PY
      - name: JavaScript syntax check
        run: node --check /tmp/toya.js
