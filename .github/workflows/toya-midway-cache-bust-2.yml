name: TOYA midway cache bust 2
on:
  push:
    paths: ['.github/workflows/toya-midway-cache-bust-2.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('docs/index.html')
          s=p.read_text()
          s2=re.sub(r'<script src="midway\.js(?:\?[^\"]*)?"></script>', '<script src="midway.js?v=20260905-1846"></script>', s)
          if s2==s:
              raise SystemExit('midway script tag not found or already current')
          p.write_text(s2)
      - run: |
          git config user.name "TOYA One updater"
          git config user.email "actions@users.noreply.github.com"
          git add docs/index.html
          git commit -m "Force refresh midway.js after removing time chips" || exit 0
          git push