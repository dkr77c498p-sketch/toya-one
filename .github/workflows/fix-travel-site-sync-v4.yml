name: Fix travel site synchronization
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-travel-site-sync-v4.yml
      - scripts/fix-travel-site-sync-v4.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: toya-fix-travel-site-sync-v4
  cancel-in-progress: false
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact tested patch and regressions
        run: python3 scripts/fix-travel-site-sync-v4.py
      - name: Publish only checked app files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/usage-hours.js docs/index.html
          if git diff --cached --quiet; then echo 'Already fixed'; exit 0; fi
          git diff --cached --stat
          git commit -m 'Fix commuting destination after site changes and enable explicit draft recovery'
          git push origin HEAD:main
