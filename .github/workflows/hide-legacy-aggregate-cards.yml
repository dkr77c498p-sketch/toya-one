name: Verify duplicate aggregate cards are hidden
on:
  push:
    branches: [fix/hide-legacy-aggregate-cards-20261106]
    paths:
      - 'docs/company-per-site-sales-r1.js'
      - '.github/workflows/hide-legacy-aggregate-cards.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-and-stage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify JavaScript and Safari-safe hiding
        run: |
          node --check docs/company-per-site-sales-r1.js
          grep -F "style.setProperty('display','none','important')" docs/company-per-site-sales-r1.js
          grep -F '#companyMonthlySummary[data-per-site-sales="r1"]>.cm-metrics' docs/company-per-site-sales-r1.js
          grep -F "各現場の月別売上・売上合計・原価・利益" docs/company-per-site-sales-r1.js
      - name: Refresh the browser cache key
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path=Path('docs/index.html')
          source=path.read_text()
          source,count=re.subn(r'company-per-site-sales-r1\.js\?v=[^"\s<]+','company-per-site-sales-r1.js?v=20261106-hide-legacy-r1',source,count=1)
          if count != 1:
              raise SystemExit('per-site sales loader not found exactly once')
          path.write_text(source)
          PY
          grep -F 'company-per-site-sales-r1.js?v=20261106-hide-legacy-r1' docs/index.html
          git diff --check
      - name: Commit verified cache refresh
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git commit -m "Refresh per-site summary after hiding legacy cards"
          git push
