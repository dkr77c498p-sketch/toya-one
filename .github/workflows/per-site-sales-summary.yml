name: Apply per-site sales summary
on:
  push:
    branches: [fix/per-site-sales-summary-20261105]
    paths:
      - 'docs/company-per-site-sales-r1.js'
      - '.github/workflows/per-site-sales-summary.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-and-load:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify script syntax and required fields
        run: |
          node --check docs/company-per-site-sales-r1.js
          grep -F '各現場の売上・原価・利益' docs/company-per-site-sales-r1.js
          grep -F '売上合計' docs/company-per-site-sales-r1.js
          grep -F 'この現場だけの累計' docs/company-per-site-sales-r1.js
      - name: Load script after monthly layout
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path=Path('docs/index.html')
          source=path.read_text()
          tag='<script src="company-per-site-sales-r1.js?v=20261105-r1"></script>'
          if tag not in source:
              source,count=re.subn(r'(<script src="company-monthly-sales-layout-r1\.js[^"]*"></script>)',r'\1\n'+tag,source,count=1)
              if count != 1:
                  raise SystemExit('monthly sales layout loader was not found exactly once')
              path.write_text(source)
          PY
          grep -F 'company-per-site-sales-r1.js?v=20261105-r1' docs/index.html
          git diff --check
      - name: Commit verified loader change
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git commit -m "Load per-site sales summary"
          git push
