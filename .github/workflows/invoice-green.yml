name: Verify approved green invoice format
on:
  push:
    branches: [fix/invoice-green-format-20261005]
    paths: ['docs/invoice-green-format.r1.js', 'scripts/invoice-green-patch.py', 'tests/invoice-green-browser.py', '.github/workflows/invoice-green.yml']
permissions:
  contents: write
jobs:
  verify-and-stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Apply exact reviewed display-only integration
        run: |
          python scripts/invoice-green-patch.py
          node --check docs/invoice-green-format.r1.js
          node --check docs/billing-bundle-ui.green-r1.js
      - name: Install pinned isolated browser tools
        run: |
          python -m pip install playwright==1.57.0 PyMuPDF==1.26.7 >/tmp/green-install.log 2>&1 || { tail -60 /tmp/green-install.log; exit 1; }
          python -m playwright install --with-deps chromium webkit >>/tmp/green-install.log 2>&1 || { tail -60 /tmp/green-install.log; exit 1; }
          sudo apt-get install -y fonts-noto-cjk >>/tmp/green-install.log 2>&1 || { tail -60 /tmp/green-install.log; exit 1; }
      - name: Test real invoice editor and PDF with no accounts or business writes
        run: |
          node tests/billing-bundle.cjs
          TOYA_TEST_BROWSER=chromium python tests/invoice-green-browser.py
          TOYA_TEST_BROWSER=webkit python tests/invoice-green-browser.py
          TOYA_TEST_BROWSER=chromium python tests/invoice-a4-browser.py
          TOYA_TEST_BROWSER=webkit python tests/invoice-a4-browser.py
          TOYA_TEST_BROWSER=chromium python tests/billing-bundle-browser.py
          TOYA_TEST_BROWSER=webkit python tests/billing-bundle-browser.py
      - name: Verify sources unchanged and real PDF dimensions
        run: |
          git diff --exit-code -- docs/project-business.a4-r1.js docs/project-documents-engine.quote5-r3.js docs/billing-bundle.r1.js docs/billing-bundle-ui.a4-r1.js docs/billing-bundle-pdf.r1.js docs/quote-pdf-export.r1.js docs/site-financial-summary.js
          python - <<'PY'
          from pathlib import Path
          import json,fitz
          for browser in ['chromium','webkit']:
              p=Path('test-output/invoice-green')/browser
              r=json.loads((p/'results.json').read_text())
              assert len(r['checks'])>=80 and not r['writes'] and not r['new_errors']
              for name in ['a.pdf','b.pdf']:
                  d=fitz.open(p/name)
                  assert len(d)==1 and d.metadata['title']=='TOYAONE'
                  assert abs(d[0].rect.width-595.27559)<.1 and abs(d[0].rect.height-841.88976)<.1
          PY
      - name: Stage only tested invoice format integration on feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/billing-bundle-ui.green-r1.js docs/index.html
          git commit -m 'Stage tested green A4 invoice format; preserve original source documents and accounting'
          git push origin HEAD:fix/invoice-green-format-20261005
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: invoice-green-verification
          retention-days: 5
          path: |
            test-output/invoice-green
            test-output/invoice-a4
            test-output/billing-bundle
            docs/invoice-green-format.r1.js
            docs/billing-bundle-ui.green-r1.js
            docs/index.html
