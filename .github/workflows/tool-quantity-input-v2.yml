name: Tool quantity input v2
on:
  push:
    paths:
      - '.github/workflows/tool-quantity-input-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch quantities
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/index.html')
          s=p.read_text()
          old="const smallCats=new Set(['小型機械','発電機','エア工具']); const machineAts=ats.filter(x=>!smallCats.has(x.category)); const smallAts=ats.filter(x=>smallCats.has(x.category)); $('#machineAttachmentChoices').innerHTML=machineAts.map(x=>`<label class=\"choice\"><input type=\"checkbox\" name=\"attachment\" value=\"${x.name}\">${x.name}</label>`).join(''); $('#smallToolChoices').innerHTML=smallAts.map(x=>`<label class=\"choice\"><input type=\"checkbox\" name=\"attachment\" value=\"${x.name}\">${x.name}</label>`).join('');"
          new="""const smallCats=new Set(['小型機械','発電機','エア工具']);
 const machineAts=ats.filter(x=>!smallCats.has(x.category));
 const smallAts=ats.filter(x=>smallCats.has(x.category));
 $('#machineAttachmentChoices').innerHTML=machineAts.map(x=>`<label class=\"choice\"><input type=\"checkbox\" name=\"attachment\" value=\"${x.name}\">${x.name}</label>`).join('');
 const qtySpec={'2kW発電機':{max:2,unit:'台'},'インバーター発電機':{max:2,unit:'台'},'エアーホース20M':{max:4,unit:'本'}};
 $('#smallToolChoices').innerHTML=smallAts.map(x=>{const q=qtySpec[x.name];if(!q)return `<label class=\"choice\"><input type=\"checkbox\" name=\"attachment\" value=\"${x.name}\">${x.name}</label>`;const opts=Array.from({length:q.max},(_,i)=>`<option value=\"${i+1}\">${i+1}${q.unit}</option>`).join('');return `<label class=\"choice\" style=\"display:grid;grid-template-columns:auto 1fr auto;gap:8px\"><input type=\"checkbox\" name=\"attachment\" value=\"${x.name}\"><span>${x.name}</span><select class=\"att-qty\" data-att-name=\"${x.name}\" data-unit=\"${q.unit}\" style=\"width:auto;min-height:38px;padding:5px 8px\">${opts}</select></label>`;}).join('');"""
          if old not in s:
              raise SystemExit('renderSelectors target not found')
          s=s.replace(old,new,1)
          init="Object.entries({sites:LS.sites,vehicles:LS.vehicles,machines:LS.machines,attachments:LS.attachments}).forEach(([n,k])=>{if(!localStorage.getItem(k))set(k,defaults[n])});"
          migration=init+"\ntry{const aa=get(LS.attachments,defaults.attachments);let cc=false;aa.forEach(x=>{if(x&&x.name==='ホース20M'){x.name='エアーホース20M';cc=true}});if(cc)set(LS.attachments,aa)}catch(e){}"
          if init in s and "x.name==='ホース20M'" not in s:s=s.replace(init,migration,1)
          anchor="function collect(){return {"
          helper="""function collectAttachmentSelections(){return $$('input[name=\"attachment\"]:checked').map(x=>{const q=$$('.att-qty').find(el=>el.dataset.attName===x.value);return q?`${x.value} × ${q.value}${q.dataset.unit||''}`:x.value})}\nfunction fillAttachmentSelections(vals=[]){const parsed=(vals||[]).map(v=>{const m=String(v).match(/^(.*?)\\s*×\\s*(\\d+)(台|本)$/);return m?{name:m[1].trim(),qty:m[2]}:{name:String(v),qty:'1'}});$$('input[name=\"attachment\"]').forEach(x=>{const hit=parsed.find(v=>v.name===x.value);x.checked=!!hit;if(hit){const q=$$('.att-qty').find(el=>el.dataset.attName===x.value);if(q)q.value=hit.qty}})}\n"""
          if 'function collectAttachmentSelections()' not in s:s=s.replace(anchor,helper+anchor,1)
          s=s.replace("attachments:checked('attachment'),","attachments:collectAttachmentSelections(),",1)
          s=s.replace("cv('worker',d.workers);cv('workType',d.workTypes);cv('vehicle',d.vehicles);cv('machine',(d.machines||[]).map(x=>x.name));cv('attachment',d.attachments);renderMachineHours();","cv('worker',d.workers);cv('workType',d.workTypes);cv('vehicle',d.vehicles);cv('machine',(d.machines||[]).map(x=>x.name));fillAttachmentSelections(d.attachments);renderMachineHours();",1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Add quantities for generators and air hose v2'
          git push
