name: Load safe attachment separation UI
on:
  push:
    paths:
      - '.github/workflows/load-attachment-separation-stable.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add attachment separation script without touching auth
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/index.html')
          s=p.read_text()
          tag='<script src="attachment-separation-stable.js?v=20260908-1705"></script>'
          if tag not in s:
              anchor='<script src="site-move-filter-fix.js?v=20260908-1542"></script>'
              if anchor not in s:
                  raise SystemExit('anchor not found')
              s=s.replace(anchor,anchor+'\n'+tag,1)
              p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Enable safe attachment section separation'
          git push
