name: Verify monthly profit work-period fix
on:
  push:
    branches: [fix/monthly-profit-work-period-20261012]
    paths: ['staging/monthly-profit/**','scripts/monthly-profit-apply.py','.github/workflows/monthly-profit.yml']
permissions:
  contents: write
jobs:
  verify-and-stage:
    if: github.ref == 'refs/heads/fix/monthly-profit-work-period-20261012'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Expand only hash-approved readable source and tests
        run: |
          python scripts/monthly-profit-apply.py
          node --check docs/work-month-revenue.r1.js
          node --check docs/company-monthly-summary.profit-r2.js
          node --check docs/site-period-ledger.profit-r2.js
          node --check docs/site-period-ledger-ui.profit-r2.js
          node tests/monthly-profit.cjs
      - name: Install pinned isolated browser tools
        run: |
          python -m pip install playwright==1.57.0 >/tmp/profit-install.log 2>&1 || { tail -50 /tmp/profit-install.log; exit 1; }
          python -m playwright install --with-deps chromium webkit >>/tmp/profit-install.log 2>&1 || { tail -50 /tmp/profit-install.log; exit 1; }
          sudo apt-get install -y fonts-noto-cjk >>/tmp/profit-install.log 2>&1 || { tail -50 /tmp/profit-install.log; exit 1; }
      - name: Verify actual application with synthetic records and zero writes
        run: |
          TOYA_TEST_BROWSER=chromium python tests/monthly-profit-browser.py
          TOYA_TEST_BROWSER=webkit python tests/monthly-profit-browser.py
      - name: Stage tested readable modules on feature branch only
        run: |
          git add docs/work-month-revenue.r1.js docs/company-monthly-summary.profit-r2.js docs/site-period-ledger.profit-r2.js docs/site-period-ledger-ui.profit-r2.js docs/index.html tests/monthly-profit.cjs tests/monthly-profit-browser.py
          git config user.name 'TOYA verification'
          git config user.email 'verification@users.noreply.github.com'
          git commit -m 'Stage verified work-month profit and cumulative project differences' || test -z "$(git diff --cached --name-only)"
          git push origin HEAD:fix/monthly-profit-work-period-20261012
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: monthly-profit-verification
          retention-days: 7
          path: |
            test-output/monthly-profit
            docs/work-month-revenue.r1.js
            docs/company-monthly-summary.profit-r2.js
            docs/site-period-ledger.profit-r2.js
            docs/site-period-ledger-ui.profit-r2.js
            docs/index.html
            tests/monthly-profit.cjs
            tests/monthly-profit-browser.py
