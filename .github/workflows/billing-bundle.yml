name: Verify contractor invoice delivery bundle
on:
  push:
    branches: [feature/contractor-billing-bundle-20261001]
    paths: ['staging/billing-bundle/**', '.github/workflows/billing-bundle.yml']
permissions:
  contents: write
jobs:
  verify-and-stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Expand only hash-approved application sources and synthetic tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,zlib,json,hashlib
          p=Path('staging/billing-bundle');m=json.loads((p/'manifest.json').read_text())
          s=''.join((p/f'source-{i}.b64').read_text().strip() for i in [1,2,3])
          # Repair one known omission in the text transfer, before checking the
          # original compressed package hash. No transformed source is executed.
          bad='BqZjJtXy';good='BqZjPQWdlTpenADZjJtXy'
          if bad in s:
              assert s.count(bad)==1
              s=s.replace(bad,good)
          raw=base64.b64decode(s,validate=True)
          assert hashlib.sha256(raw).hexdigest()==m['package_sha256'], 'Package changed during transfer'
          files=json.loads(zlib.decompress(raw))
          allowed={'docs/billing-bundle.r1.js','docs/billing-bundle-ui.r1.js','tests/billing-bundle.cjs','tests/billing-bundle-browser.py','scripts/billing-bundle-patch.py'}
          assert set(files)==set(m['files'])==allowed
          for name,content in files.items():
              assert hashlib.sha256(content.encode()).hexdigest()==m['files'][name],name
              dest=Path(name);assert not dest.exists(), 'Refuse to overwrite existing source'
              dest.parent.mkdir(parents=True,exist_ok=True);dest.write_text(content)
          PY
          python scripts/billing-bundle-patch.py
          node --check docs/billing-bundle.r1.js
          node --check docs/billing-bundle-ui.r1.js
          node --check docs/project-business.bundle-r1.js
      - name: Install pinned isolated-browser test tools
        run: |
          python -m pip install playwright==1.57.0 PyMuPDF==1.26.7
          python -m playwright install --with-deps chromium webkit
          sudo apt-get install -y fonts-noto-cjk
      - name: Test calculations, source preservation and full application with no real accounts
        run: |
          node tests/billing-bundle.cjs
          TOYA_TEST_BROWSER=chromium python tests/billing-bundle-browser.py
          TOYA_TEST_BROWSER=webkit python tests/billing-bundle-browser.py
      - name: Check PDF metadata and render actual pages for visual review
        run: |
          python - <<'PY'
          from pathlib import Path
          import fitz,json,hashlib
          for engine in ['chromium','webkit']:
              out=Path('test-output/billing-bundle')/engine
              r=json.loads((out/'results.json').read_text())
              assert len(r['checks'])>=42
              pdf=fitz.open(out/'TOYAONE_bundle_sample.pdf')
              assert len(pdf)==3 and pdf.metadata['title']=='TOYAONE'
              for i,page in enumerate(pdf):
                  assert abs(page.rect.width-595.27559)<.1 and abs(page.rect.height-841.88976)<.1
                  page.get_pixmap(matrix=fitz.Matrix(1.3,1.3)).save(out/f'pdf-page-{i+1}.png')
          m=json.loads(Path('staging/billing-bundle/manifest.json').read_text())
          for name,sha in m['outputs'].items():
              assert hashlib.sha256((Path('docs')/name).read_bytes()).hexdigest()==sha,name
          PY
          git diff --exit-code -- docs/project-business.pdf-r1.js docs/project-documents-engine.quote5-r3.js docs/quote-pdf-export.r1.js docs/site-financial-summary.js docs/company-monthly-summary.autoselect-r1.js docs/shared-site-master.names-only-r1.js
      - name: Stage only tested reviewable source files on this feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/billing-bundle.r1.js docs/billing-bundle-ui.r1.js docs/project-business.bundle-r1.js docs/index.html scripts/billing-bundle-patch.py tests/billing-bundle.cjs tests/billing-bundle-browser.py
          git commit -m 'Stage verified read-only customer invoice/progress PDF bundle; no financial data changes'
          git push origin HEAD:feature/contractor-billing-bundle-20261001
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: billing-bundle-verification
          retention-days: 5
          path: |
            test-output/billing-bundle
            docs/billing-bundle*.js
            docs/project-business.bundle-r1.js
            docs/index.html
            scripts/billing-bundle-patch.py
            tests/billing-bundle*
